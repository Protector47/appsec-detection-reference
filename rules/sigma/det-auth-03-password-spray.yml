title: Application Bad Password Failure (base event for DET-AUTH-03)
id: 8e94aef9-8a97-40d1-896f-0f95cdd63d15
name: appsec_bad_password
status: experimental
description: Login failure caused by a wrong password. Base rule, not alerted on its own.
author: Protector47
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    product: appsec
    service: security_events
detection:
    selection:
        event: authn_login_fail
        reason: bad_password
    condition: selection
falsepositives:
    - Not alerted on its own
level: informational
---
title: Password Spray From One ASN (DET-AUTH-03)
id: 139d0af8-8178-44a4-b65f-15894aa0c2a9
status: experimental
description: Thirty or more distinct users fail with a bad password from one ASN within one hour. Pair it with a per user count of three or fewer in your SIEM to separate spray from stuffing.
author: Protector47
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - appsec_bad_password
    group-by:
        - asn
    timespan: 1h
    condition:
        gte: 30
        field: user_id
falsepositives:
    - Shared kiosks and call center networks
level: high
