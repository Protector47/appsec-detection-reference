title: Application Login Failure (base event for DET-AUTH-01)
id: 6f3b1c52-8a4e-4c1d-9a51-2e7f0b9c4a01
name: appsec_login_failure
status: experimental
description: Failed primary login recorded by the application. Base rule, not alerted on its own.
references:
    - https://github.com/Protector47/appsec-detection-reference/blob/main/docs/02-authentication-and-session.md
author: Protector47
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1110.004
logsource:
    product: appsec
    service: security_events
detection:
    selection:
        event: authn_login_fail
    condition: selection
falsepositives:
    - Not alerted on its own
level: informational
---
title: Credential Stuffing From One Source (DET-AUTH-01)
id: 6f3b1c52-8a4e-4c1d-9a51-2e7f0b9c4a02
status: experimental
description: Twenty or more distinct users fail login from one source IP within ten minutes. Starting threshold, tune on your own data.
author: Protector47
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1110.004
correlation:
    type: value_count
    rules:
        - appsec_login_failure
    group-by:
        - src_ip
    timespan: 10m
    condition:
        gte: 20
        field: user_id
falsepositives:
    - Corporate NAT or carrier grade NAT
    - Synthetic monitoring accounts
level: high
